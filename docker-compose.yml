services:
  bot:
    build: .
    image: aurorahue:latest
    container_name: aurorahue-bot
    restart: unless-stopped
    env_file:
      - .env
      # Deploy info (COMMIT / BRANCH / DEPLOY_TIME) written by update.sh.
      # Optional so `docker compose up` works before the first update.sh run.
      - path: configs/git.env
        required: false
