services:
  db:
    image: postgres:17-alpine
    container_name: aurorahue-db
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env.
    env_file:
      - .env
    volumes:
      - aurorahue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    image: aurorahue:latest
    container_name: aurorahue-bot
    restart: unless-stopped
    # tini as PID 1 forwards SIGTERM to the bot, also before its own handler is installed
    # (during migrations); Python as PID 1 would ignore it until then.
    init: true
    env_file:
      - .env
      # Deploy info (COMMIT / BRANCH / DEPLOY_TIME) written by update.sh.
      # Optional so `docker compose up` works before the first update.sh run.
      - path: configs/git.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # configs/lights.json (the light access file) is read from here, read-only.
      - ./configs:/app/configs:ro

volumes:
  aurorahue-db-data:
