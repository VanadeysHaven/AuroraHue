# Throwaway Postgres for the test suite.
# Start with: docker compose -f compose.test.yaml up -d
# Tests use: TEST_DATABASE_URL=postgresql+asyncpg://aurorahue:aurorahue@localhost:55433/aurorahue_test
# Port 55433 (not 55432) so it can run next to Sidequest's test database.
services:
  db-test:
    image: postgres:17-alpine
    container_name: aurorahue-db-test
    environment:
      POSTGRES_USER: aurorahue
      POSTGRES_PASSWORD: aurorahue
      POSTGRES_DB: aurorahue_test
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
